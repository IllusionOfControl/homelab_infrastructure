[defaults]
inventory = inventory/hosts.yml
roles_path = roles:../roles:~/.ansible/roles:/usr/share/ansible/roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True
forks = 10
timeout = 30
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
usetty = False
pipelining = True
ssh_args = -C -o ControlMaster=no -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o KexAlgorithms=curve25519-sha256
