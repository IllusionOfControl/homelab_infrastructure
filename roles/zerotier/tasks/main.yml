---
# ============================================================
# ZeroTier One VPN Daemon Installation & Network Membership
# ============================================================
- name: Remove conflicting legacy ZeroTier apt source files and keyrings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/zerotier.list
    - /usr/share/keyrings/zerotier-keyring.gpg

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download ZeroTier GPG signing key
  ansible.builtin.shell:
    cmd: >
      curl -s 'https://raw.githubusercontent.com/zerotier/ZeroTierOne/master/doc/contact%40zerotier.com.gpg' |
      gpg --dearmor --yes -o /usr/share/keyrings/zerotier-debian-package-key.gpg
  args:
    creates: /usr/share/keyrings/zerotier-debian-package-key.gpg

- name: Configure ZeroTier official apt repository
  ansible.builtin.deb822_repository:
    name: zerotier
    types: [deb]
    uris: "http://download.zerotier.com/debian/{{ ansible_facts['distribution_release'] | default('trixie') }}"
    suites: ["{{ ansible_facts['distribution_release'] | default('trixie') }}"]
    components: [main]
    signed_by: /usr/share/keyrings/zerotier-debian-package-key.gpg
    state: present
- name: Install ZeroTier One package
  ansible.builtin.apt:
    name: zerotier-one
    state: present

- name: Ensure zerotier-one service is enabled and started
  ansible.builtin.systemd:
    name: zerotier-one
    state: started
    enabled: true

- name: Manage ZeroTier network membership
  when:
    - zerotier_network_id is defined
    - zerotier_network_id | length > 0
    - zerotier_network_id != 'change_me_network_id'
  block:
    - name: Check currently joined ZeroTier networks
      ansible.builtin.command: zerotier-cli listnetworks
      register: zt_networks
      changed_when: false

    - name: Join ZeroTier network
      ansible.builtin.command: "zerotier-cli join {{ zerotier_network_id }}"
      when: zerotier_network_id not in zt_networks.stdout
      changed_when: true

    - name: Configure ZeroTier network flags
      ansible.builtin.command: >
        zerotier-cli set {{ zerotier_network_id }}
        allowGlobal={{ zerotier_allow_global | int }}
        allowDefault={{ zerotier_allow_default | int }}
        allowDNS={{ zerotier_allow_dns | int }}
      changed_when: false
